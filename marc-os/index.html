<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOTOGO M.A.R.C. OS</title>
<style>
:root{
  --bg:#0b0c0f; --panel:#14161b; --panel2:#1b1e25; --line:#2a2e37;
  --text:#f2f3f5; --dim:#9aa0ab; --red:#c0392b; --red2:#e5483b;
  --accent:#f9eb22; --ink:#16130a; --ok:#2ecc71; --warn:#f0a030;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:272px 1fr;height:100vh;height:100dvh}

/* Sol panel */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px;letter-spacing:-.5px}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand span{font-size:12px;color:var(--dim)}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav h3{font-size:12px;font-weight:600;color:var(--dim);padding:12px 8px 6px}
.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 10px;border-radius:10px;color:#d6d9df}
.item:hover{background:var(--panel2)}
.item[aria-current="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.item svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item small{display:block;color:var(--dim);font-size:12px;line-height:1.2}
.quota{margin:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.quota p{font-size:13px;color:var(--dim);margin-bottom:8px}
.quota p b{color:var(--text)}
.bar{height:6px;border-radius:4px;background:#2a2e37;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:66%;background:var(--accent)}
.buy{width:100%;padding:10px;border-radius:10px;background:var(--accent);color:var(--ink);font-weight:700}
.buy:hover{filter:brightness(1.05)}

/* Ana alan */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.top h1{font-size:16px;font-weight:700}
.top .tag{margin-left:auto;font-size:12px;color:var(--ink);background:var(--accent);padding:3px 9px;border-radius:99px;font-weight:700}
.note{background:#1d1a08;color:#e9dc7a;border-bottom:1px solid #3a3410;font-size:13px;padding:8px 20px}

.chat{flex:1;overflow:auto;padding:24px 20px 12px}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px}
.msg.me{justify-content:flex-end}
.bubble{background:var(--panel2);border:1px solid var(--line);padding:11px 15px;border-radius:16px;max-width:85%}
.me .bubble{background:var(--red);border-color:var(--red);border-bottom-right-radius:5px}
.av{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:12px}
.bot{flex:1;min-width:0}
.bot p{margin-bottom:10px}
.cards{display:grid;gap:10px;margin:10px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.card h4{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row span:last-child{color:var(--dim);text-align:right}
.ok{color:var(--ok)!important}.warn{color:var(--warn)!important}
.chk{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:14px}
.chk i{width:18px;height:18px;border-radius:5px;border:1.5px solid #4a505c;flex:none}
.shop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.shop b{display:block;font-size:14px}
.shop small{color:var(--dim)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge.on{background:rgba(46,204,113,.15);color:var(--ok)}
.badge.off{background:#2a2e37;color:var(--dim)}
.mini{font-size:12px;border:1px solid var(--line);padding:5px 10px;border-radius:8px;color:#d6d9df;white-space:nowrap}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.small{font-size:12px;color:var(--dim)}
.wave{display:flex;align-items:center;gap:3px;height:34px;margin:6px 0}
.wave i{display:block;width:4px;border-radius:2px;background:var(--accent)}
.disc{font-size:12px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px;margin-top:8px}

/* Giriş */
.composer{padding:10px 20px 18px}
.cbox{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:7px 7px 7px 16px}
.cbox:focus-within{border-color:var(--accent)}
.cbox input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:8px 0}
.cbox input::placeholder{color:#6f7682}
.cbox input:focus{outline:0}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic{background:var(--red);color:#fff}
.send{background:var(--accent);color:var(--ink)}
.foot{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:#6f7682}

.qchip{display:none;margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:99px}
@media(max-width:820px){
  .app{grid-template-columns:72px 1fr}
  .brand{justify-content:center;padding:12px 0 8px}
  .brand div:last-child{display:none}
  .nav{padding:4px 4px}
  .nav h3{display:none}
  .item{flex-direction:column;justify-content:flex-start;gap:5px;padding:10px 2px;text-align:center}
  .item span{font-size:10.5px;line-height:1.2;color:inherit}
  .item small{display:none}
  .item[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
  .quota{display:none}
  .qchip{display:inline-block}
  .top .tag{margin-left:0}
  .top,.chat,.composer,.note{padding-left:14px;padding-right:14px}
  .bubble{max-width:92%}
}
.bubble,.bot{white-space:pre-wrap;word-wrap:break-word}
.typing{color:var(--dim)}
.form{display:grid;gap:10px;margin:10px 0}
.form label{display:grid;gap:4px;font-size:13px;color:var(--dim)}
.form input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit}
.chk{cursor:pointer;user-select:none}
.chk.on i{background:var(--ok);border-color:var(--ok)}
.chk.on{color:var(--dim)}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug button{border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;color:#d6d9df}
.sug button:hover{border-color:var(--accent);color:var(--accent)}
.paywall{text-align:center}
.paywall p{margin-bottom:10px}

.hbtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);place-items:center;flex:none}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hl{display:flex;align-items:center;border-radius:10px}
.hl:hover,.hl[aria-current="true"]{background:var(--panel2)}
.hl .ht{flex:1;min-width:0;text-align:left;padding:8px 10px;font-size:14px;color:#d6d9df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .hx{flex:none;width:30px;height:30px;color:var(--dim);border-radius:8px;font-size:18px;line-height:1}
.hl .hx:hover{color:var(--red2)}
.empty{font-size:13px;color:var(--dim);padding:6px 10px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex}
.drawer[hidden]{display:none}
.dpanel{width:min(86vw,340px);background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.dpanel h3{font-size:12px;font-weight:600;color:var(--dim);padding:4px 8px 8px}
.newc{width:100%;margin-bottom:8px;padding:10px;border-radius:10px;background:var(--accent);color:var(--ink);font-weight:700}
@media(max-width:820px){.hbtn{display:grid}.nav .hl,.nav .empty{display:none}.top{gap:8px}}

.att{max-width:760px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.att[hidden]{display:none}
.att span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--text);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);color:var(--dim)}
.ib.plus{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.ib.plus:hover{border-color:var(--accent);color:var(--accent)}
.ib.mic.on{background:var(--accent);color:var(--ink)}
.topics{display:grid;gap:10px;margin:10px 0}
.topics button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:14px}
.topics button:hover{border-color:var(--accent)}
.chk-h{font-size:13px;color:var(--dim);font-weight:600;margin:10px 0 2px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Hizmetler">
    <div class="brand"><div class="logo">MG</div><div><b>MOTOGO M.A.R.C. OS</b><span>Sadece motosiklet için</span></div></div>
    <nav class="nav" id="nav"><h3>Hizmetler</h3></nav>
    <div class="quota">
      <p id="qtext"><b>3 ücretsiz soru</b></p>
      <div class="bar"><i id="qbar"></i></div>
      <button class="buy" id="buy">M.A.R.C. OS’u aç</button>
    </div>
  </aside>
  <main class="main">
    <header class="top"><button class="hbtn" id="hbtn" aria-label="Son yazışmalar"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><h1 id="ttl">Yol ve hava</h1><span class="qchip" id="qchip"></span><span class="tag">Beta</span></header>
    <div class="chat" id="chat"><div class="col" id="col"></div></div>
    <div class="composer">
      <div class="att" id="att" hidden><span id="attn"></span><button id="attx" type="button" aria-label="Eki kaldır">×</button></div>
      <input type="file" id="file" accept="image/*,audio/*" hidden>
      <form class="cbox" id="f" autocomplete="off">
        <button class="ib plus" id="plus" type="button" aria-label="Fotoğraf ya da ses kaydı ekle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <input id="inp" maxlength="800" placeholder="Motorunla ilgili bir şey sor…" aria-label="Soru">
        <button class="ib mic" id="mic" type="button" aria-label="Sesle yaz"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="ib send" aria-label="Gönder" type="submit"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="foot">Sadece motosiklet konularında yardımcı olur. Bilgiler bilgi amaçlıdır, teşhis değildir.</div>
    </div>
  </main>
</div>
<div class="drawer" id="drawer" hidden><div class="dpanel"><button class="newc" id="newc">Yeni sohbet</button><h3>Son yazışmalar</h3><div id="histDrawer"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
