<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0c0f; --panel:#14161b; --panel2:#1b1e25; --line:#2a2e37; --text:#f2f3f5; --dim:#9aa0ab;
  --red:#c0392b; --red2:#e5483b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b0c0f; --panel:#14161b; --panel2:#1b1e25; --line:#2a2e37; --text:#f2f3f5; --dim:#9aa0ab; --red:#c0392b; --red2:#e5483b; }
}
:root[data-theme="dark"]{ --bg:#0b0c0f; --panel:#14161b; --panel2:#1b1e25; --line:#2a2e37; --text:#f2f3f5; --dim:#9aa0ab; --red:#c0392b; --red2:#e5483b; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;}
button,input,select{font-family:inherit;color:inherit;}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 60px;}
h1{margin:4px 0 4px;font-size:21px;line-height:1.2;}
.sub{margin:0 0 12px;color:var(--dim);font-size:13.5px;}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 0 10px;}
.stageIn{display:flex;justify-content:center;background:#000;border-radius:12px;padding:6px;}
canvas{display:block;max-width:100%;max-height:34vh;border-radius:8px;background:#000;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
.card h2{margin:0 0 8px;font-size:15.5px;}
.lab{display:block;font-size:12.5px;color:var(--dim);font-weight:600;margin:10px 0 5px;}
.inp,.sel{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;padding:10px 12px;min-height:44px;}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.seg button{flex:1;border:0;background:var(--panel2);color:var(--dim);font-weight:700;font-size:13px;padding:10px 4px;min-height:44px;cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff;}
.btn{border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:15.5px;padding:14px;min-height:50px;cursor:pointer;width:100%;}
.btn.g{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;}
.btn[disabled]{opacity:.5;cursor:default;}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:16px 12px;text-align:center;color:var(--dim);cursor:pointer;}
.drop b{color:var(--text);display:block;font-size:15px;margin-bottom:2px;}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px;}
.th{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;aspect-ratio:9/12;}
.th video,.th img{width:100%;height:100%;object-fit:cover;display:block;}
.th span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);border-radius:6px;font-size:10.5px;padding:2px 6px;}
.th button{position:absolute;top:3px;right:3px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;cursor:pointer;}
.note{color:var(--dim);font-size:12.5px;margin:8px 0 0;}
.bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:10px;}
.bar i{display:block;height:100%;width:0;background:var(--red2);}
.status{margin:8px 0 0;font-size:13.5px;color:var(--dim);min-height:20px;}
.err{color:#f09595;}
video#out{width:100%;max-height:70vh;background:#000;border-radius:12px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;}
.sw button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--red);}
.sw input[type=color]{width:44px;height:36px;border:0;background:none;padding:0;}
input[type=range]{width:100%;accent-color:var(--red);}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;}
.chk input{width:20px;height:20px;accent-color:var(--red);}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important;}}
</style>
<style>
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ozet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.oz{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.oz span{display:block;font-size:12px;color:var(--dim);}
.oz b{font-size:17px;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{color:var(--dim);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);}
td{text-align:right;padding:9px 4px;border-bottom:1px solid var(--line);}
th:first-child,td:first-child{text-align:left;}
tr[data-d]{cursor:pointer;}
.sil{background:none;border:0;color:var(--dim);font-size:18px;padding:0 6px;cursor:pointer;}
.gd{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px;}
.gd span{flex:1;color:var(--dim);} .gd button{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;}
</style>
<title>Kurye Ekspres</title>
</head>
<body>
<div class="wrap">
  <h1>Kurye Ekspres</h1>
  <p class="sub">Günlük kazancını, paketlerini, kilometreni ve giderlerini tek tabloda tut. Veriler yalnızca bu telefonda saklanır.</p>

  <div class="card">
    <div class="row" style="align-items:center;justify-content:space-between;flex-wrap:nowrap">
      <button class="btn g" id="prev" type="button" style="width:52px;padding:0" aria-label="Önceki ay">‹</button>
      <h2 id="ayAd" style="margin:0;text-align:center;flex:1"></h2>
      <button class="btn g" id="next" type="button" style="width:52px;padding:0" aria-label="Sonraki ay">›</button>
    </div>
    <div class="ozet" id="ozet"></div>
    <label class="lab" for="hedef">Bu ay biriktirme hedefi (TL)</label>
    <input class="inp" id="hedef" type="number" inputmode="decimal" min="0" placeholder="Örn: 15000">
    <div class="bar"><i id="hedefBar"></i></div>
    <p class="note" id="hedefNot"></p>
  </div>

  <div class="card">
    <h2>Günü kaydet</h2>
    <label class="lab" for="tarih">Tarih</label>
    <input class="inp" id="tarih" type="date">
    <div class="two">
      <div><label class="lab" for="paket">Paket sayısı</label><input class="inp" id="paket" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div><label class="lab" for="ciro">Günün cirosu (TL)</label><input class="inp" id="ciro" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    </div>
    <label class="lab" for="km">Gidilen yol (km)</label>
    <input class="inp" id="km" type="number" inputmode="decimal" min="0" placeholder="0">
    <div class="row" style="margin-top:8px">
      <button class="btn g" id="gps" type="button" style="flex:1">Konumla ölç</button>
      <span class="note" id="gpsNot" style="flex:1;align-self:center;margin:0"></span>
    </div>

    <h2 style="margin-top:16px">Gider ekle</h2>
    <div class="two">
      <div><label class="lab" for="gTur">Gider türü</label>
        <select class="sel" id="gTur"><option>Yakıt</option><option>Lastik / tamir</option><option>Bakım</option><option>Yemek</option><option>Diğer</option></select></div>
      <div><label class="lab" for="gTutar">Tutar (TL)</label><input class="inp" id="gTutar" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    </div>
    <div class="two">
      <div><label class="lab" for="gLitre">Litre (yakıtta)</label><input class="inp" id="gLitre" type="number" inputmode="decimal" min="0" placeholder="0"></div>
      <div><label class="lab" for="gNot">Not</label><input class="inp" id="gNot" type="text" maxlength="40" placeholder="İsteğe bağlı"></div>
    </div>
    <button class="btn g" id="gEkle" type="button" style="margin-top:8px">Gider ekle</button>
    <div id="giderler"></div>

    <button class="btn" id="kaydet" type="button" style="margin-top:12px">Günü kaydet</button>
    <p class="status" id="durum" role="status" aria-live="polite"></p>
  </div>

  <div class="card">
    <h2>Gün gün tablo</h2>
    <div id="tablo"></div>
    <button class="btn g" id="csv" type="button" style="margin-top:10px">Bu ayı tablo olarak indir (CSV)</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
var KEY='mg_kurye_v1';
var db=load(), ay=new Date(); ay.setDate(1);
var cur={paket:0,ciro:0,km:0,gider:[]}, watchId=null, gpsKm=0, lastPos=null;
function load(){ try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.days) return d; }catch(e){} return {days:{},hedef:{}}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){} }
function pad(n){ return n<10?'0'+n:''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function ayKey(){ return ay.getFullYear()+'-'+pad(ay.getMonth()+1); }
var AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function tl(n){ return (Math.round((+n||0)*100)/100).toLocaleString('tr-TR',{maximumFractionDigits:2})+' TL'; }
function sayi(n){ return (Math.round((+n||0)*10)/10).toLocaleString('tr-TR',{maximumFractionDigits:1}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function topGider(day){ return (day.gider||[]).reduce(function(s,g){ return s+(+g.tutar||0); },0); }

function ozet(){
  var key=ayKey(), p=0,c=0,k=0,g=0,n=0;
  Object.keys(db.days).forEach(function(d){ if(d.indexOf(key)===0){ var x=db.days[d]; p+=+x.paket||0; c+=+x.ciro||0; k+=+x.km||0; g+=topGider(x); n++; } });
  var net=c-g;
  $('#ayAd').textContent=AYLAR[ay.getMonth()]+' '+ay.getFullYear();
  $('#ozet').innerHTML=[['Ciro',tl(c)],['Gider',tl(g)],['Net kazanç',tl(net)],['Paket',sayi(p)],['Kilometre',sayi(k)+' km'],['Paket başına net',p?tl(net/p):'-']].map(function(x){ return '<div class="oz"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'; }).join('');
  var h=+db.hedef[key]||0; $('#hedef').value=h||'';
  var oran=h>0?Math.max(0,Math.min(100,net/h*100)):0; $('#hedefBar').style.width=oran+'%';
  $('#hedefNot').textContent=h>0?('Hedefin %'+Math.round(oran)+'. Kalan: '+tl(Math.max(0,h-net))+(n?' ('+n+' gün kayıtlı)':'')):'Bir hedef yazarsan net kazancının ilerlemesini burada görürsün.';
  tablo();
}
function tablo(){
  var key=ayKey(), gunler=Object.keys(db.days).filter(function(d){ return d.indexOf(key)===0; }).sort().reverse();
  if(!gunler.length){ $('#tablo').innerHTML='<p class="note">Bu ay için henüz kayıt yok.</p>'; return; }
  $('#tablo').innerHTML='<div class="tw"><table><thead><tr><th>Gün</th><th>Paket</th><th>Km</th><th>Ciro</th><th>Gider</th><th>Net</th><th></th></tr></thead><tbody>'+gunler.map(function(d){ var x=db.days[d], g=topGider(x); return '<tr data-d="'+d+'"><td>'+d.slice(8)+'.'+d.slice(5,7)+'</td><td>'+sayi(x.paket)+'</td><td>'+sayi(x.km)+'</td><td>'+sayi(x.ciro)+'</td><td>'+sayi(g)+'</td><td><b>'+sayi((+x.ciro||0)-g)+'</b></td><td><button type="button" class="sil" data-d="'+d+'" aria-label="Sil">×</button></td></tr>'; }).join('')+'</tbody></table></div><p class="note">Düzenlemek için satıra dokun.</p>';
  [].forEach.call(document.querySelectorAll('#tablo tr[data-d]'),function(tr){ tr.addEventListener('click',function(e){ if(e.target.classList.contains('sil')) return; $('#tarih').value=tr.dataset.d; gunYukle(); window.scrollTo({top:document.querySelector('#kaydet').offsetTop-400,behavior:'smooth'}); }); });
  [].forEach.call(document.querySelectorAll('#tablo .sil'),function(b){ b.addEventListener('click',function(e){ e.stopPropagation(); if(confirm(b.dataset.d+' kaydı silinsin mi?')){ delete db.days[b.dataset.d]; save(); ozet(); if($('#tarih').value===b.dataset.d) gunYukle(); } }); });
}
function gunYukle(){
  var d=$('#tarih').value, x=db.days[d];
  cur=x?JSON.parse(JSON.stringify(x)):{paket:0,ciro:0,km:0,gider:[]};
  $('#paket').value=cur.paket||''; $('#ciro').value=cur.ciro||''; $('#km').value=cur.km||'';
  giderCiz(); $('#durum').textContent=x?'Bu günün kaydı yüklendi.':'';
}
function giderCiz(){
  $('#giderler').innerHTML=(cur.gider||[]).map(function(g,i){ return '<div class="gd"><span>'+esc(g.tur)+(g.litre?' · '+sayi(g.litre)+' L':'')+(g.not?' · '+esc(g.not):'')+'</span><b>'+tl(g.tutar)+'</b><button type="button" data-i="'+i+'" aria-label="Sil">×</button></div>'; }).join('');
  [].forEach.call(document.querySelectorAll('#giderler button'),function(b){ b.addEventListener('click',function(){ cur.gider.splice(+b.dataset.i,1); giderCiz(); }); });
}
$('#gEkle').addEventListener('click',function(){
  var t=+$('#gTutar').value; if(!(t>0)){ $('#durum').textContent='Gider tutarını yaz.'; return; }
  cur.gider=cur.gider||[]; cur.gider.push({tur:$('#gTur').value,tutar:t,litre:+$('#gLitre').value||0,not:$('#gNot').value.trim()});
  $('#gTutar').value=''; $('#gLitre').value=''; $('#gNot').value=''; giderCiz(); $('#durum').textContent='Gider eklendi. Günü kaydetmeyi unutma.';
});
$('#kaydet').addEventListener('click',function(){
  var d=$('#tarih').value; if(!d){ $('#durum').textContent='Tarihi seç.'; return; }
  cur.paket=+$('#paket').value||0; cur.ciro=+$('#ciro').value||0; cur.km=+$('#km').value||0;
  db.days[d]=JSON.parse(JSON.stringify(cur)); save();
  var key=d.slice(0,7); ay=new Date(+key.slice(0,4),+key.slice(5,7)-1,1);
  ozet(); $('#durum').textContent='Kaydedildi: '+d.slice(8)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
});
$('#hedef').addEventListener('input',function(){ db.hedef[ayKey()]=+this.value||0; save(); ozet2(); });
function ozet2(){ var y=$('#hedef').value; ozet(); $('#hedef').value=y; }
$('#prev').addEventListener('click',function(){ ay.setMonth(ay.getMonth()-1); ozet(); });
$('#next').addEventListener('click',function(){ ay.setMonth(ay.getMonth()+1); ozet(); });
$('#tarih').addEventListener('change',gunYukle);

// Konumla kilometre ölçümü (sayfa açık ve ekran uyanık kalmalı)
function hav(a,b){ var R=6371,t=function(x){return x*Math.PI/180;}, dLa=t(b.latitude-a.latitude), dLo=t(b.longitude-a.longitude), q=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(t(a.latitude))*Math.cos(t(b.latitude))*Math.sin(dLo/2)*Math.sin(dLo/2); return 2*R*Math.asin(Math.sqrt(q)); }
$('#gps').addEventListener('click',function(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; $('#gps').textContent='Konumla ölç'; var v=(+$('#km').value||0)+gpsKm; $('#km').value=Math.round(v*10)/10; $('#gpsNot').textContent='Ölçülen '+sayi(gpsKm)+' km kutuya eklendi.'; gpsKm=0; lastPos=null; return; }
  if(!navigator.geolocation){ $('#gpsNot').textContent='Bu tarayıcı konumu desteklemiyor, km\'yi elle yaz.'; return; }
  gpsKm=0; lastPos=null; $('#gps').textContent='Ölçümü bitir'; $('#gpsNot').textContent='Ölçülüyor... Sayfayı açık tut.';
  watchId=navigator.geolocation.watchPosition(function(p){ var c=p.coords; if(c.accuracy>60) return; if(lastPos){ var d=hav(lastPos,c); if(d>0.01&&d<2){ gpsKm+=d; } } lastPos=c; $('#gpsNot').textContent='Ölçülüyor: '+sayi(gpsKm)+' km'; },function(e){ $('#gpsNot').textContent='Konum alınamadı. İzin verdiğinden emin ol.'; },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
});

$('#csv').addEventListener('click',function(){
  var key=ayKey(), satir=[['Tarih','Paket','Km','Ciro','Gider','Net']];
  Object.keys(db.days).filter(function(d){ return d.indexOf(key)===0; }).sort().forEach(function(d){ var x=db.days[d], g=topGider(x); satir.push([d,x.paket||0,x.km||0,x.ciro||0,g,(+x.ciro||0)-g]); });
  var csv='\ufeff'+satir.map(function(r){ return r.join(';'); }).join('\n'), a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='kurye-'+key+'.csv'; document.body.appendChild(a); a.click(); a.remove();
});

$('#tarih').value=ymd(new Date()); gunYukle(); ozet();
window.__kurye={db:function(){return db;},ozet:ozet};

})();
</script>
</body>
</html>
