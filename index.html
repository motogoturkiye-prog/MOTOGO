<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGo — Markanızı Seçin, Gerisini Bize Bırakın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C1392B">
<link rel="apple-touch-icon" href="img/logo.png">
</head>
<body>

  <header class="topbar">
    <a href="https://www.motogo.tr/" target="_blank" aria-label="MotoGo Türkiye ana sayfa">
      <img src="img/logo.png" alt="MotoGo" class="logo-img">
    </a>
    <div class="topbar-actions">
      <a href="https://motogo.com.tr/prime/" target="_blank" class="pill-btn pill-live">
        <span class="live-dot"></span> MotoGo Prime CANLI
      </a>
    </div>
  </header>

  <main class="wrap">

    <section class="hero">
      <h1>Markanızı Seçin, Gerisini Bize Bırakın</h1>
      <p>Yazmaya başlayın, markanızı bulun — servis, bayi, yedek parça, aksesuar ya da yol yardım.</p>
    </section>

    <section class="form-card" id="step-search">
      <div class="field">
        <label>Motosiklet Markanız</label>
        <input type="text" id="brandInput" placeholder="Örn: BMW, Honda, Yamaha..." autocomplete="off">
        <div id="brandSuggestions" class="suggestions"></div>
      </div>
    </section>

    <section class="form-card" id="quickActions">
      <p class="field-title">Hızlı Erişim</p>
      <div class="subcat-grid" id="quickGrid"></div>
    </section>

    <section class="form-card" id="yardimSection" style="display:none;">
      <div class="selected-brand-row">
        <span class="selected-brand-name">MotoGo Yol Yardım</span>
        <button type="button" id="yardimBackBtn" class="link-btn">Geri</button>
      </div>
      <p class="field-title" id="yardimCatTitle">Arıza türünü seçin</p>
      <div class="subcat-grid" id="yardimCatGrid"></div>
      <div id="yardimResults"></div>
    </section>

    <section class="form-card" id="step-brand" style="display:none;">
      <p class="selected-brand-label">Seçilen marka</p>
      <div class="selected-brand-row">
        <span id="selectedBrandName" class="selected-brand-name"></span>
        <button type="button" id="changeBrandBtn" class="link-btn">Değiştir</button>
      </div>

      <div class="brand-info" id="brandInfo"></div>

      <p class="field-title">Ne arıyorsunuz?</p>
      <div class="subcat-grid" id="subcatGrid"></div>
    </section>

    <section class="form-card" id="step-city" style="display:none;">
      <p class="selected-brand-label">Seçilen hizmet</p>
      <div class="selected-brand-row">
        <span id="selectedSubcatName" class="selected-brand-name"></span>
        <button type="button" id="changeSubcatBtn" class="link-btn">Değiştir</button>
      </div>

      <div class="field">
        <label>Hangi şehirdesiniz?</label>
        <select id="citySelect">
          <option value="">Şehrinizi seçin</option>
        </select>
      </div>

      <button class="cta-btn" id="showResultsBtn">Uygun Firmaları Göster</button>
    </section>

    <section class="results" id="results" style="display:none;">
      <div id="resultsList"></div>
    </section>

  </main>

  <footer class="site-footer">MotoGo Türkiye</footer>

  <script src="js/brands-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
