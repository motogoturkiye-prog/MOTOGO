<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGo — Markanızı Seçin, Gerisini Bize Bırakın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C1392B">
<link rel="apple-touch-icon" href="img/icon-512.png">
</head>
<body>

  <header class="topbar">
    <img src="img/logo.png" alt="MotoGo" class="logo-img">
    <div class="topbar-actions">
      <a href="https://motogo.com.tr/prime/" target="_blank" class="pill-btn pill-live">
        <span class="live-dot"></span> MotoGo Prime CANLI
      </a>
    </div>
  </header>

  <main class="wrap">

    <section class="hero" style="margin-top:6px;margin-bottom:14px;">
      <h1>Markanızı Seçin,<br>Gerisini Bize Bırakın</h1>
    </section>

    <section class="form-card" id="mainForm" style="margin-top:14px;">
      <div class="field">
        <label>Motosiklet Markanız</label>
        <div class="brand-input-wrap">
          <input type="text" id="brandInput" placeholder="Örn: BMW, Honda, Yamaha..." autocomplete="off">
          <span class="blink-cursor" id="blinkCursor"></span>
        </div>
        <div id="brandSuggestions" class="suggestions"></div>
        <p class="brand-info" id="brandInfo" style="display:none;"></p>
      </div>

      <div class="field">
        <label>Ne Arıyorsunuz?</label>
        <div class="subcat-grid" id="subcatGrid" style="margin-top:8px;"></div>
      </div>

      <div class="field" id="cityField" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">
        <label>Hangi şehirdesiniz?</label>
        <select id="citySelect">
          <option value="">Şehrinizi seçin</option>
        </select>
      </div>

      <button class="cta-btn" id="showResultsBtn" style="margin-bottom:14px;">Uygun Firmaları Göster</button>

      <div id="yardimSection" style="display:none;padding-bottom:80px;">
        <div class="subcat-grid" id="yardimCatGrid" style="margin-top:14px;"></div>
        <div id="yardimResults"></div>
      </div>
    </section>

    <section class="results" id="results" style="display:none;">
      <div id="resultsList"></div>
    </section>

  </main>

  <footer class="site-footer">MotoGo Türkiye</footer>

  <nav class="bottom-nav">
    <a href="https://www.motogo.tr/" target="_blank" class="bottom-nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg>
      <span>Firma Girişi</span>
    </a>
    <a href="https://www.motogo.tr/" target="_blank" class="bottom-nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
      <span>Başvuru</span>
    </a>
    <a href="#" id="kilavuzNavBtn" class="bottom-nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Kılavuz</span>
    </a>
    <a href="https://wa.me/905331509890" target="_blank" class="bottom-nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>Asistan</span>
    </a>
    <a href="https://www.motogo.tr/category/all-products" target="_blank" class="bottom-nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h18l-1.5 9h-15z"/><path d="M3 3l-.5 4M20.5 12l.7 4.2a1 1 0 0 1-1 1.3H4.8a1 1 0 0 1-1-1.3L4.5 12"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      <span>MotoGo Store</span>
    </a>
  </nav>

  <script src="js/brands-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
