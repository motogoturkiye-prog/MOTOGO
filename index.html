<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGo — Markanızı Seçin, Gerisini Bize Bırakın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C1392B">
<link rel="apple-touch-icon" href="img/icon-512.png">
</head>
<body>

  <header class="topbar">
    <a href="https://www.motogo.tr/" target="_blank" aria-label="MotoGo Türkiye ana sayfa">
      <img src="img/logo.png" alt="MotoGo" class="logo-img">
    </a>
    <div class="topbar-actions">
      <a href="https://motogo.com.tr/prime/" target="_blank" class="pill-btn pill-live">
        <span class="live-dot"></span> MotoGo Prime CANLI
      </a>
    </div>
  </header>

  <main class="wrap">

    <section class="hero">
      <h1>Markanızı Seçin, Gerisini Bize Bırakın</h1>
      <p>Yazmaya başlayın, markanızı bulun — servis, bayi, yedek parça, aksesuar ya da yol yardım.</p>
    </section>

    <section class="form-card" id="mainForm">
      <div class="field">
        <label>Motosiklet Markanız</label>
        <div class="brand-input-wrap">
          <input type="text" id="brandInput" placeholder="Örn: BMW, Honda, Yamaha..." autocomplete="off">
          <span class="blink-cursor" id="blinkCursor"></span>
        </div>
        <div id="brandSuggestions" class="suggestions"></div>
        <p class="brand-info" id="brandInfo" style="display:none;"></p>
      </div>

      <div class="field">
        <label>Ne Arıyorsunuz?</label>
        <div class="subcat-grid" id="subcatGrid"></div>
      </div>

      <p class="yardim-divider">⚡ Ekstra: Yol Yardım</p>
      <div class="field">
        <div class="subcat-grid" id="yardimGrid"></div>
      </div>

      <div class="field" id="cityField" style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line);">
        <label>Hangi şehirdesiniz?</label>
        <select id="citySelect">
          <option value="">Şehrinizi seçin</option>
        </select>
      </div>

      <button class="cta-btn" id="showResultsBtn">Uygun Firmaları Göster</button>

      <div id="yardimSection" style="display:none;">
        <div id="yardimResults"></div>
      </div>
    </section>

    <section class="results" id="results" style="display:none;">
      <div id="resultsList"></div>
    </section>

  </main>

  <footer class="site-footer">MotoGo Türkiye</footer>

  <script src="js/brands-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
