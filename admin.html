<!DOCTYPE html>

<title>MotoGo — Yönetim Paneli</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#14171d; --line:#23262e; --red:#C1392B; --red-dark:#9c2e22;
    --text:#ffffff; --text-dim:#9a9aa2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px;padding-bottom:60px;
  }
  h1{font-size:16px;margin:0 0 16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:12px;font-weight:600;margin:0 0 4px;color:#e8e8ea;}
  input,select,textarea{
    background:var(--bg);border:1px solid var(--line);color:#fff;border-radius:6px;
    padding:8px 10px;font-size:13px;width:100%;margin-bottom:10px;font-family:inherit;
  }
  textarea{resize:vertical;}
  button{
    background:var(--red);color:#fff;border:none;border-radius:6px;
    padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
  }
  button:hover{background:var(--red-dark);}
  button.secondary{background:var(--bg);border:1px solid var(--line);}
  button.danger{background:#791f1f;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tab-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:8px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .tab-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
  .row-item{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .row-item-text{font-size:12.5px;color:#e8e8ea;line-height:1.5;flex:1;}
  .row-item-text b{color:#fff;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .row-actions button{padding:6px 10px;font-size:11.5px;}
  #status{font-size:12.5px;margin-top:8px;}
  #loginScreen{max-width:340px;margin:60px auto;}
  .checkbox-group label{display:flex;align-items:center;gap:6px;font-weight:400;margin-bottom:6px;}
  .checkbox-group input{width:auto;margin:0;}
  .hidden{display:none;}
  #logoutBtn{position:fixed;top:16px;right:16px;padding:7px 12px;font-size:12px;}
</style>
</head>

const SUPABASE_URL = "https://xdyrgiwastvwqgmpsihc.supabase.co";
const SUPABASE_KEY = "sb_publishable_wjEQ3JkigYiCIzLMyHCzdg_wCpkIkOT";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginScreen = document.getElementById('loginScreen');
const panelScreen = document.getElementById('panelScreen');
const loginStatus = document.getElementById('loginStatus');

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  loginStatus.textContent = "Giriş yapılıyor...";
  loginStatus.style.color = "#9a9aa2";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    loginStatus.textContent = "⚠️ " + error.message;
    loginStatus.style.color = "#f09595";
  } else {
    showPanel();
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function checkSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) showPanel();
}
checkSession();

function showPanel() {
  loginScreen.classList.add('hidden');
  panelScreen.classList.remove('hidden');
  renderTabs();
  loadTab(TABLES[0].key);
}

function genKod() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let k = '';
  for (let i = 0; i < 8; i++) k += abc[Math.floor(Math.random() * abc.length)];
  return k;
}
function fmtKod(k) { k = k || ''; return k.length === 8 ? k.slice(0, 4) + '-' + k.slice(4) : k; }
function waNum(raw) {
  const d = String(raw || '').replace(/\D/g, '');
  if (d.length === 10) return '90' + d;
  if (d.length === 11 && d[0] === '0') return '90' + d.slice(1);
  if (d.length === 12 && d.startsWith('90')) return d;
  return '';
}
function fmtT(d){ d=d?String(d).slice(0,10):''; return d.length===10?(d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4)):'-'; }

  {
    key: 'basvuru', label: '🏢 Firma Başvuruları (Kurumsal)', table: 'firma_basvurulari', order: 'firma_unvani',
    listText: r => `<b>${r.firma_unvani || ''}</b>${r.marka_ismi ? ' (' + r.marka_ismi + ')' : ''} — ${r.yetkili_ad_soyad || ''} — ${r.yetkili_gsm || ''}<br>Paket: ${r.hizmet_paketleri || '-'} · Ödeme: ${r.odeme_plani || '-'} · Başvuru tarihi: ${fmtT(r.created_at || r.olusturma || r.tarih)}<br>Vergi dairesi: <b>${r.vergi_dairesi || '-'}</b> · Vergi no: <b>${r.vergi_no || '-'}</b> · TC: <b>${r.tc_kimlik || '-'}</b><br>Faaliyet: ${r.faaliyet_alani || '-'} · Web: ${r.web || '-'}${r.firma_ozellikleri ? '<br>Özellikler: ' + r.firma_ozellikleri : ''}${regMark(r)}`,
    fields: [
      { id:'firma_unvani', label:'Firma unvanı', type:'text', required:true },
      { id:'marka_ismi', label:'Marka ismi', type:'text' },
      { id:'yetkili_ad_soyad', label:'Yetkili ad soyad', type:'text', required:true },
      { id:'yetkili_gsm', label:'Yetkili GSM', type:'text', required:true },
      { id:'firma_telefon', label:'Firma telefonu', type:'text' },
      { id:'email', label:'E-posta', type:'text' },
      { id:'hizmet_paketleri', label:'Seçtiği hizmet paketleri', type:'textarea' },
      { id:'odeme_plani', label:'Ödeme planı', type:'text' },
      { id:'adres', label:'Adres', type:'text' },
      { id:'vergi_dairesi', label:'Vergi dairesi', type:'text' },
      { id:'vergi_no', label:'Vergi numarası', type:'text' },
      { id:'tc_kimlik', label:'TC kimlik no', type:'text' },
      { id:'web', label:'Web sitesi', type:'text' },
      { id:'faaliyet_alani', label:'Faaliyet alanı', type:'text' },
      { id:'firma_ozellikleri', label:'Firma özellikleri', type:'textarea' }
    ]
  }
];

let editingId = null;
let pendingReg = null;

/* ---------- Başvurudan tek tıkla firma kaydı ---------- */
const REG_TARGETS = [
  ['firmalar','Firmalar (Özel Servis / Yetkili Servis)'],
  ['yardim','Yol Yardım'],
  ['avantaj','Aksesuar ve Ekipman'],
  ['uygfirma','Firma Profilleri (Konaklama, Sigorta, Ehliyet, Yakıt, Market, Mola)'],
  ['kiralik','Kiralık Motor'],
  ['yakit','Yakıt İndirimi'],
  ['ekspertiz','Ekspertiz']
];
const REG_PAKETLER = ['Kurumsal Üyelik Paketi','Temel İşletme Paketi','Yol Yardım Paketi'];
function todayISO(){ return new Date().toISOString().slice(0,10); }
function plusYearISO(){ const d = new Date(); d.setFullYear(d.getFullYear() + 1); return d.toISOString().slice(0,10); }
function regGet(){ try { return JSON.parse(localStorage.getItem('mg_basvuru_kayit') || '{}'); } catch(e){ return {}; } }
function markRegistered(id){ if(id == null) return; const o = regGet(); o[id] = todayISO(); try { localStorage.setItem('mg_basvuru_kayit', JSON.stringify(o)); } catch(e){} }
function regMark(r){ const o = regGet(); return (r && o[r.id]) ? '<br><span style="color:#7ad99a">✅ Firma olarak kaydedildi (' + fmtT(o[r.id]) + ')</span>' : ''; }
function guessCity(txt){
  const t = String(txt || '').toLocaleLowerCase('tr'); let best = '';
  CITIES.forEach(c => { if(t.indexOf(c.toLocaleLowerCase('tr')) >= 0 && c.length > best.length) best = c; });
  return best;
}
function guessPaket(row){
  const t = String(row.hizmet_paketleri || '').toLocaleLowerCase('tr');
  if(t.indexOf('yol yardım') >= 0) return 'Yol Yardım Paketi';
  if(t.indexOf('temel') >= 0) return 'Temel İşletme Paketi';
  return 'Kurumsal Üyelik Paketi';
}
function guessTarget(row){
  const t = (String(row.faaliyet_alani || '') + ' ' + String(row.hizmet_paketleri || '')).toLocaleLowerCase('tr');
  if(t.indexOf('yol yardım') >= 0 || t.indexOf('çekici') >= 0) return 'yardim';
  if(/konaklama|otel|pansiyon|kamp|sigorta|ehliyet|market|kafe|restoran/.test(t)) return 'uygfirma';
  if(/aksesuar|ekipman|kask|mont|eldiven/.test(t)) return 'avantaj';
  return 'firmalar';
}
function regMap(row, def){
  const city = guessCity(row.adres), ad = row.marka_ismi || row.firma_unvani || '';
  const m = { ad: ad, firma_adi: ad, telefon: row.firma_telefon || row.yetkili_gsm || '', whatsapp: waNum(row.yetkili_gsm), website: row.web || '',
    adres: row.adres || '', aciklama: row.firma_ozellikleri || '', sehir: city, il: city, kayit_tarihi: fmtT(todayISO()), onayli: 'true' };
  const out = {};
  def.fields.forEach(f => { if(m[f.id] != null && m[f.id] !== '') out[f.id] = m[f.id]; });
  return out;
}
function openRegModal(row){
  const old = document.getElementById('regModal'); if(old) old.remove();
  const ov = document.createElement('div'); ov.id = 'regModal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;';
  const gp = guessPaket(row), gt = guessTarget(row);
  ov.innerHTML = '<div class="card" style="max-width:460px;width:100%;margin:0;">' +
    '<h3 style="margin:0 0 4px;font-size:15px;">Firmayı kaydet</h3>' +
    '<p style="margin:0 0 12px;font-size:12.5px;color:var(--text-dim);"><b>' + (row.firma_unvani || '') + '</b> için bölümü ve paketi seç. Sonra bilgileri hazır dolu bir form açılır, kontrol edip Ekle\'ye basman yeter.</p>' +
    '<label>Hangi bölümde görünecek?</label><select id="rg_hedef">' + REG_TARGETS.map(t => '<option value="' + t[0] + '"' + (t[0] === gt ? ' selected' : '') + '>' + t[1] + '</option>').join('') + '</select>' +
    '<label>Satın aldığı paket</label><select id="rg_paket">' + REG_PAKETLER.map(p => '<option' + (p === gp ? ' selected' : '') + '>' + p + '</option>').join('') + '</select>' +
    '<label>Üyelik başlangıç</label><input type="date" id="rg_bas" value="' + todayISO() + '">' +
    '<label>Üyelik bitiş (varsayılan: 1 yıl sonrası)</label><input type="date" id="rg_bit" value="' + plusYearISO() + '">' +
    '<div style="margin-top:12px;"><button id="rg_devam">Devam: formu doldur</button><button id="rg_iptal" class="secondary" style="margin-left:8px;">Vazgeç</button></div></div>';
  document.body.appendChild(ov);
  document.getElementById('rg_iptal').addEventListener('click', () => ov.remove());
  document.getElementById('rg_devam').addEventListener('click', async () => {
    const key = document.getElementById('rg_hedef').value, paket = document.getElementById('rg_paket').value;
    const bas = document.getElementById('rg_bas').value, bit = document.getElementById('rg_bit').value;
    if(!bit){ alert('Bitiş tarihi gerekli.'); return; }
    ov.remove();
    await loadTab(key, true);
    const def = TABLES.find(t => t.key === key);
    pendingReg = { row: row, paket: paket, baslangic: bas, bitis: bit, targetKey: key };
    renderForm(def, regMap(row, def));
    const ff = document.getElementById('formFields');
    const ban = document.createElement('div');
    ban.style.cssText = 'background:#1d3a2a;border:1px solid #2c6b45;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:12.5px;line-height:1.5;';
    ban.innerHTML = '<b>' + (row.firma_unvani || '') + '</b> başvurusundan dolduruldu. Eksik alanları (şehir, marka, kategori, fotoğraf vb.) kontrol et, sonra <b>Ekle</b>\'ye bas. Ekle\'ye basınca <b>' + paket + '</b> (' + fmtT(bas) + ' → ' + fmtT(bit) + ') <b>Üyelikler</b>\'e de otomatik eklenir. Vazgeçersen <b>İptal</b>\'e bas.';
    ff.parentNode.insertBefore(ban, ff);
    document.getElementById('formTitle').textContent = def.label + ': başvurudan yeni kayıt';
    document.getElementById('cancelEditBtn').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  TABLES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = t.label;
    btn.addEventListener('click', () => loadTab(t.key));
    btn.dataset.key = t.key;
    tabs.appendChild(btn);
  });
}

function setActiveTab(key) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });
}

function fieldInputHtml(f, value) {
  if (f.type === 'select') {
    const opts = f.options.map(o => `<option value="${o.value}" ${String(value)===o.value?'selected':''}>${o.label}</option>`).join('');
    return `<select id="f_${f.id}"><option value="">Seçin</option>${opts}</select>`;
  }
  if (f.type === 'textarea') {
    return `<textarea id="f_${f.id}" rows="3">${value || ''}</textarea>`;
  }
  if (f.type === 'checkboxes') {
    const vals = value || [];
    const boxes = f.options.map(o => `
      <label><input type="checkbox" value="${o.value}" ${vals.includes(o.value)?'checked':''} class="cb_${f.id}"> ${o.label}</label>
    `).join('');
    return `<div class="checkbox-group" id="f_${f.id}_group">${boxes}</div>`;
  }
  if (f.type === 'photo') {
    return `
      <input type="hidden" id="f_${f.id}" value="${value != null ? value : ''}">
      <input type="file" id="f_${f.id}_file" accept="image/*" style="margin-bottom:6px;">
      <div id="f_${f.id}_status" style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">
        ${value ? '✅ Fotoğraf yüklü' : 'Henüz fotoğraf yok'}
      </div>
      ${value ? `<img src="${value}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-bottom:10px;">` : ''}
    `;
  }
  if (f.type === 'date') {
    return `<input type="date" id="f_${f.id}" value="${value != null ? value : ''}">`;
  }
  return `<input type="text" id="f_${f.id}" value="${value != null ? value : ''}">`;
}

function readFieldValue(f) {
  if (f.type === 'checkboxes') {
    return Array.from(document.querySelectorAll('.cb_' + f.id)).filter(c => c.checked).map(c => c.value);
  }
  const el = document.getElementById('f_' + f.id);
  const v = el.value.trim();
  if (f.id === 'lat' || f.id === 'lng') return v ? parseFloat(v) : null;
  if (f.id === 'sira_no') return v ? parseInt(v, 10) : null;
  return v || null;
}

let yKontrolEdildi = false;
async function yoneticiKontrol() {
  if (yKontrolEdildi) return;
  yKontrolEdildi = true;
  try {
    const r = await sb.rpc('yonetici_mi');
    if (!r || r.data !== false) return;
    const s = await sb.auth.getSession();
    const mail = (s && s.data && s.data.session && s.data.session.user && s.data.session.user.email) || '(e-posta bulunamadı)';
    const sql = "insert into public.yoneticiler (email) values ('" + mail + "') on conflict do nothing;";
    const d = document.createElement('div');
    d.style.cssText = 'background:#3a1d1d;border:1px solid #6b2c2c;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:13px;line-height:1.5;';
    d.innerHTML = '<b>⚠️ Bu hesap yönetici olarak tanımlı değil.</b><br>Giriş yaptığın e-posta: <b>' + mail + '</b>. Üyelik ve başvuru listeleri bu yüzden boş görünüyor. Supabase > SQL Editor\'de aşağıdaki satırı çalıştır, sonra çıkış yapıp tekrar gir:<pre style="white-space:pre-wrap;word-break:break-all;background:#0b0c0f;border-radius:8px;padding:8px;margin:8px 0 0;font-size:12px">' + sql + '</pre><button id="kopyaSql" class="secondary" style="margin-top:8px">Kopyala</button>';
    const tc = document.getElementById('tabContent');
    tc.parentNode.insertBefore(d, tc);
    document.getElementById('kopyaSql').addEventListener('click', () => { try { navigator.clipboard.writeText(sql); document.getElementById('kopyaSql').textContent = 'Kopyalandı'; } catch (e) {} });
  } catch (e) {}
}
async function loadTab(key, keepPending) {
  if(!keepPending) pendingReg = null;
  yoneticiKontrol();
  setActiveTab(key);
  editingId = null;
  const def = TABLES.find(t => t.key === key);
  const content = document.getElementById('tabContent');
  content.innerHTML = `
    <div class="card">
      <h3 id="formTitle" style="margin:0 0 12px;font-size:14px;">Yeni ${def.label} Ekle</h3>
      <div id="formFields"></div>
      <button id="saveBtn">Ekle</button>
      <button id="cancelEditBtn" class="secondary hidden" style="margin-left:8px;">İptal</button>
      <div id="status"></div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 12px;font-size:14px;">Kayıtlı ${def.label}</h3>
      <div id="listArea">Yükleniyor...</div>
    </div>
  `;
  renderForm(def, {});
  document.getElementById('saveBtn').addEventListener('click', () => saveRow(def));
  document.getElementById('cancelEditBtn').addEventListener('click', () => loadTab(key));
  await refreshList(def);
}

function renderForm(def, values) {
  const formFields = document.getElementById('formFields');
  formFields.innerHTML = def.fields.map(f => `
    <label>${f.label}${f.required ? ' *' : ''}</label>
    ${fieldInputHtml(f, values[f.id])}
  `).join('');

  def.fields.filter(f => f.type === 'photo').forEach(f => {
    const fileInput = document.getElementById(`f_${f.id}_file`);
    const hiddenInput = document.getElementById(`f_${f.id}`);
    const status = document.getElementById(`f_${f.id}_status`);
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      status.textContent = 'Yükleniyor...';
      status.style.color = '#9a9aa2';
      const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
      const { error } = await sb.storage.from('Firma Fotograflari').upload(path, file);
      if (error) {
        status.textContent = '⚠️ Yüklenemedi: ' + error.message;
        status.style.color = '#f09595';
        return;
      }
      const { data } = sb.storage.from('Firma Fotograflari').getPublicUrl(path);
      hiddenInput.value = data.publicUrl;
      status.textContent = '✅ Fotoğraf yüklendi';
      status.style.color = '#9a9aa2';
    });
  });
}

async function refreshList(def) {
  const listArea = document.getElementById('listArea');
  const { data, error } = await sb.from(def.table).select('*').order(def.order);
  if (error) {
    listArea.innerHTML = `<div style="color:#f09595;font-size:12.5px;">Hata: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    listArea.innerHTML = `<div style="color:#9a9aa2;font-size:12.5px;">Henüz kayıt yok.</div>`;
    return;
  }
  listArea.innerHTML = '';
  data.forEach(row => {
    const item = document.createElement('div');
    item.className = 'row-item';
    item.innerHTML = `
      <div class="row-item-text">${def.listText(row)}</div>
      <div class="row-actions">
        ${def.key === 'basvuru' ? '<button class="reg-btn">Firmayı kaydet ▸</button>' : ''}
        <button class="secondary edit-btn">Düzenle</button>
        <button class="danger del-btn">Sil</button>
      </div>
    `;
    const rb = item.querySelector('.reg-btn'); if(rb) rb.addEventListener('click', () => openRegModal(row));
    item.querySelector('.edit-btn').addEventListener('click', () => startEdit(def, row));
    item.querySelector('.del-btn').addEventListener('click', () => deleteRow(def, row));
    listArea.appendChild(item);
  });
}

function startEdit(def, row) {
  editingId = def.idField ? row[def.idField] : row.id;
  document.getElementById('formTitle').textContent = `${def.label} Düzenle`;
  document.getElementById('saveBtn').textContent = 'Güncelle';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  renderForm(def, row);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function saveRow(def) {
  const status = document.getElementById('status');
  const data = {};
  for (const f of def.fields) {
    const val = readFieldValue(f);
    if (f.required && (val === null || (Array.isArray(val) && val.length === 0))) {
      status.textContent = `⚠️ "${f.label}" zorunludur.`;
      status.style.color = '#f09595';
      return;
    }
    data[f.id] = val;
  }
  if (def.key === 'uyeler') {
    if (!data.baslangic) delete data.baslangic;
    if (data.kod) data.kod = data.kod.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!data.kod) { if (editingId === null) data.kod = genKod(); else delete data.kod; }
    if (data.cihaz_sifirla === 'evet') data.cihazlar = [];
    delete data.cihaz_sifirla;
  }
  if (def.key === 'uygfirma') { data.onayli = (data.onayli === 'true'); }
  status.textContent = 'Kaydediliyor...';
  status.style.color = '#9a9aa2';

  let result;
  if (editingId !== null) {
    const idField = def.idField || 'id';
    result = await sb.from(def.table).update(data).eq(idField, editingId);
  } else {
    result = await sb.from(def.table).insert(data);
  }

  if (result.error) {
    status.textContent = '⚠️ ' + result.error.message;
    status.style.color = '#f09595';
  } else {
    let flash = '✅ Kaydedildi.', flashColor = '#9a9aa2';
    if(pendingReg && editingId === null && def.key !== 'uyeler' && def.key !== 'basvuru'){
      const pr = pendingReg;
      const uy = { tur: 'kurumsal', ad: pr.row.firma_unvani || pr.row.marka_ismi, iletisim: pr.row.yetkili_gsm || pr.row.firma_telefon || null, paket: pr.paket, bitis: pr.bitis, kod: genKod() };
      if(pr.baslangic) uy.baslangic = pr.baslangic;
      const r2 = await sb.from('uyelikler').insert(uy);
      if(r2.error){ flash = '⚠️ Firma kaydedildi ama üyelik eklenemedi: ' + r2.error.message + ' Üyelikler sekmesinden elle ekle.'; flashColor = '#f09595'; }
      else { flash = '✅ Firma kaydedildi ve Üyelikler\'e eklendi (' + pr.paket + ', bitiş ' + fmtT(pr.bitis) + ').'; flashColor = '#7ad99a'; markRegistered(pr.row.id); }
    }
    await loadTab(def.key);
    const st2 = document.getElementById('status'); if(st2){ st2.textContent = flash; st2.style.color = flashColor; }
  }
}

async function deleteRow(def, row) {
  if (!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
  const idField = def.idField || 'id';
  const { error } = await sb.from(def.table).delete().eq(idField, row[idField]);
  if (error) {
    alert('Hata: ' + error.message);
  } else {
    refreshList(def);
  }
}
</script>
</body>
</html>
